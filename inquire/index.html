<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4A2C20" />
    <meta name="description" content="Ask Disenyo Digitals about AI systems, websites and digital solutions, and get a quote." />
    <title>Inquire with Disenyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
    />
    <script type="module" crossorigin src="/inquire/assets/index-CuWQ7TE4.js"></script>
    <link rel="stylesheet" crossorigin href="/inquire/assets/index-BNcPspFe.css">
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <p class="brand-name">Disenyo Digitals Collective</p>
          <p class="brand-line">AI + Digital Solutions</p>
        </div>
        <!-- Shows the team's mobile, Viber, WhatsApp and Messenger in the chat, like the "Talk to a person" chip. -->
        <button id="person" class="person" type="button">Talk to a person</button>
      </header>

      <main id="log" class="log" role="log" aria-live="polite" aria-label="Conversation"></main>

      <footer class="composer">
        <div id="picker" class="picker"></div>
        <div id="chips" class="chips" aria-label="Suggested replies"></div>
        <form id="form" class="form" autocomplete="off">
          <label for="input" class="visually-hidden">Your message</label>
          <textarea id="input" rows="1" maxlength="2000" placeholder="Type your question…" enterkeyhint="send"></textarea>
          <button id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.5 2-12.5 2z" fill="currentColor" /></svg>
          </button>
        </form>
        <p class="disclosure">You're chatting with Disenyo's AI assistant. A team member reviews every inquiry.</p>
      </footer>
    </div>
  </body>
</html>
